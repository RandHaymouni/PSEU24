<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&display=swap" rel="stylesheet">
    <title>Rock Paper Scissors</title>
</head>

<body>
    <div class="wrapper">
        <div class="scoreboard">
            <div class="title">
                <img src="assets/title.png" />
            </div>
            <div class="score">
                <p>SCORE</p>
                <h1> 0 </h1>
            </div>
        </div>
        <div class="hands">
            <div class="hand paper">
                <img src="assets/Paper.png" onclick="pickUserHand('paper')" />
            </div>
            <div class="hand scissors">
                <img src="assets/Scissors.png" onclick="pickUserHand('scissors')" />
            </div>
            <div class="hand rock">
                <img src="assets/Rock.png" onclick="pickUserHand('rock')" />
            </div>
        </div>
        <div class="contest">
            <div class="userhand">
                <h1>YOU PICKED</h1>
                <div class="handImageContainer">
                    <img id="userPickImage" src="assets/Paper.png">
                </div>
            </div>
            <div class="referee">
                <div class="decision">
                    <h1> YOU WIN! </h1>
                </div>
                <div class="newGame" onclick="restartGame()">PLAY AGAIN</div>
            </div>
            <div class="computerhand">
                <h1>THE HOUSE PICKED</h1>
                <div class="handImageContainer">
                    <img id="computerPickImage" src="assets/Paper.png" />
                </div>
            </div>
        </div>
        <button class="rules-toggle-btn" tabindex="1">RULES</button>
        <div class="popup">
            <div class="popup-content">
                <header class="popup-header">
                    <h2 class="popup-title">Rules</h2>
                    <button class="popup-close-btn">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </header>
                <img src="assets/rules.svg" alt="Rules Image" class="popup-rules-img" />
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
